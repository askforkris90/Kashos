<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Pro - Kash OS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .app-header {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      text-align: center;
    }
    .app-header h1 {
      color: #2e3652;
      margin-bottom: 0.5rem;
    }
    .calendar-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .calendar-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .calendar-header h2 {
      font-size: 1.5rem;
    }
    .calendar-nav button {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      margin: 0 0.25rem;
      font-weight: 600;
      transition: background 0.3s;
    }
    .calendar-nav button:hover {
      background: rgba(255,255,255,0.3);
    }
    .calendar-grid {
      padding: 2rem;
    }
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .weekday {
      text-align: center;
      font-weight: 700;
      color: #2e3652;
      padding: 0.75rem 0;
    }
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1rem;
    }
    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #e7eaf6;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
      color: #2e3652;
    }
    .day:hover {
      background: #f0f3ff;
      border-color: #667eea;
    }
    .day.today {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: #667eea;
    }
    .day.other-month {
      color: #ccc;
      cursor: not-allowed;
    }
    .events {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 2px solid #e7eaf6;
    }
    .events h3 {
      color: #2e3652;
      margin-bottom: 1rem;
    }
    .event-item {
      background: #f8faff;
      padding: 1rem;
      border-radius: 8px;
      border-left: 4px solid #667eea;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .event-time {
      font-weight: 600;
      color: #667eea;
      min-width: 80px;
    }
    .event-title {
      color: #2e3652;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="app-header">
      <h1>📅 Calendar Pro</h1>
      <p>Schedule meetings, events, and sync with friends</p>
    </div>

    <div class="calendar-container">
      <div class="calendar-header">
        <h2 id="monthYear">June 2026</h2>
        <div class="calendar-nav">
          <button onclick="previousMonth()">&larr; Prev</button>
          <button onclick="todayMonth()">Today</button>
          <button onclick="nextMonth()">Next &rarr;</button>
        </div>
      </div>

      <div class="calendar-grid">
        <div class="weekdays">
          <div class="weekday">Sun</div>
          <div class="weekday">Mon</div>
          <div class="weekday">Tue</div>
          <div class="weekday">Wed</div>
          <div class="weekday">Thu</div>
          <div class="weekday">Fri</div>
          <div class="weekday">Sat</div>
        </div>
        <div class="days" id="calendarDays"></div>
      </div>

      <div class="events">
        <h3>📌 Upcoming Events</h3>
        <div class="event-item">
          <div class="event-time">10:00 AM</div>
          <div class="event-title">Team Standup</div>
        </div>
        <div class="event-item">
          <div class="event-time">2:00 PM</div>
          <div class="event-title">Project Review with Friends</div>
        </div>
        <div class="event-item">
          <div class="event-time">4:30 PM</div>
          <div class="event-title">Coffee with Sarah</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date(2026, 5, 2);

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      document.getElementById('monthYear').textContent = 
        currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();
      
      let html = '';
      
      for (let i = firstDay - 1; i >= 0; i--) {
        html += `<div class="day other-month">${daysInPrevMonth - i}</div>`;
      }
      
      for (let i = 1; i <= daysInMonth; i++) {
        const isToday = i === 2 && month === 5 && year === 2026;
        html += `<div class="day ${isToday ? 'today' : ''}">${i}</div>`;
      }
      
      const totalCells = firstDay + daysInMonth;
      const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      for (let i = 1; i <= remainingCells; i++) {
        html += `<div class="day other-month">${i}</div>`;
      }
      
      document.getElementById('calendarDays').innerHTML = html;
    }

    function previousMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    function todayMonth() {
      currentDate = new Date(2026, 5, 2);
      renderCalendar();
    }

    renderCalendar();
  </script>
</body>
</html>

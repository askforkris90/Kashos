<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player - Kash OS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #000;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .video-player {
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .video-frame {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #1e1e1e 0%, #333 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      position: relative;
    }
    .play-button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 3px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 2rem;
    }
    .play-button:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.1);
    }
    .controls {
      padding: 1.5rem;
      background: #1a1a1a;
    }
    .video-info {
      margin-bottom: 1.5rem;
    }
    .video-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .video-stats {
      display: flex;
      gap: 1rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }
    .recommendations {
      margin-top: 2rem;
    }
    .recommendations-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    .video-card {
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .video-card:hover {
      transform: scale(1.05);
    }
    .video-thumbnail {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .video-card-info {
      padding: 0.75rem;
    }
    .video-card-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
    }
    .video-card-source {
      font-size: 0.85rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="video-player">
      <div class="video-frame">
        <div class="play-button">▶️</div>
      </div>
      <div class="controls">
        <div class="video-info">
          <div class="video-title">Kashos: The Future of Social Discovery</div>
          <div class="video-stats">
            <span>📺 Documentary</span>
            <span>⏱️ 45 minutes</span>
            <span>👁️ 12.4K views</span>
          </div>
        </div>
      </div>
    </div>

    <div class="recommendations">
      <div class="recommendations-title">🎬 Recommended for You</div>
      <div class="video-grid">
        <div class="video-card">
          <div class="video-thumbnail">🎥</div>
          <div class="video-card-info">
            <div class="video-card-title">Tech Talks 2026</div>
            <div class="video-card-source">Friend Recommendation</div>
          </div>
        </div>
        <div class="video-card">
          <div class="video-thumbnail">🎬</div>
          <div class="video-card-info">
            <div class="video-card-title">Digital Revolution</div>
            <div class="video-card-source">Trending Now</div>
          </div>
        </div>
        <div class="video-card">
          <div class="video-thumbnail">📹</div>
          <div class="video-card-info">
            <div class="video-card-title">Social Innovation</div>
            <div class="video-card-source">Suggested by Alex</div>
          </div>
        </div>
        <div class="video-card">
          <div class="video-thumbnail">🎞️</div>
          <div class="video-card-info">
            <div class="video-card-title">Privacy First</div>
            <div class="video-card-source">Educational</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Hub - Kash OS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .app-header {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-header h1 {
      color: #2e3652;
    }
    button {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(236,72,153,0.3);
    }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .project-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      transition: transform 0.3s;
    }
    .project-card:hover {
      transform: translateY(-5px);
    }
    .project-header {
      background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
      color: white;
      padding: 1.5rem;
    }
    .project-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .project-status {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .project-body {
      padding: 1.5rem;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e7eaf6;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
      transition: width 0.3s;
    }
    .project-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .info-item {
      font-size: 0.9rem;
    }
    .info-label {
      color: #6a768d;
      font-weight: 600;
    }
    .info-value {
      color: #2e3652;
      margin-top: 0.25rem;
    }
    .team-members {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #e7eaf6;
    }
    .member-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e7eaf6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="app-header">
      <div>
        <h1>💼 Project Hub</h1>
        <p>Collaborate on projects with trusted team members</p>
      </div>
      <button>+ New Project</button>
    </div>

    <div class="projects-grid">
      <div class="project-card">
        <div class="project-header">
          <div class="project-title">Kashos App Ecosystem</div>
          <div class="project-status">In Progress</div>
        </div>
        <div class="project-body">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 75%"></div>
          </div>
          <div class="project-info">
            <div class="info-item">
              <div class="info-label">Deadline</div>
              <div class="info-value">June 30</div>
            </div>
            <div class="info-item">
              <div class="info-label">Priority</div>
              <div class="info-value">High</div>
            </div>
          </div>
          <div class="team-members">
            <div class="member-avatar">AK</div>
            <div class="member-avatar">SM</div>
            <div class="member-avatar">JD</div>
          </div>
        </div>
      </div>

      <div class="project-card">
        <div class="project-header">
          <div class="project-title">Backend Infrastructure</div>
          <div class="project-status">Planning</div>
        </div>
        <div class="project-body">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 25%"></div>
          </div>
          <div class="project-info">
            <div class="info-item">
              <div class="info-label">Deadline</div>
              <div class="info-value">July 15</div>
            </div>
            <div class="info-item">
              <div class="info-label">Priority</div>
              <div class="info-value">Medium</div>
            </div>
          </div>
          <div class="team-members">
            <div class="member-avatar">AK</div>
            <div class="member-avatar">CD</div>
          </div>
        </div>
      </div>

      <div class="project-card">
        <div class="project-header">
          <div class="project-title">Mobile App Release</div>
          <div class="project-status">Testing</div>
        </div>
        <div class="project-body">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 60%"></div>
          </div>
          <div class="project-info">
            <div class="info-item">
              <div class="info-label">Deadline</div>
              <div class="info-value">June 20</div>
            </div>
            <div class="info-item">
              <div class="info-label">Priority</div>
              <div class="info-value">High</div>
            </div>
          </div>
          <div class="team-members">
            <div class="member-avatar">AK</div>
            <div class="member-avatar">ES</div>
            <div class="member-avatar">MJ</div>
            <div class="member-avatar">+2</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

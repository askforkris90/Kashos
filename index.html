<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Name Suggestion Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .results {
            margin-top: 30px;
        }

        .results-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .domain-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .domain-item:hover {
            transform: translateX(5px);
        }

        .domain-name {
            font-weight: bold;
            color: #333;
            word-break: break-all;
        }

        .domain-status {
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 3px;
            white-space: nowrap;
            margin-left: 10px;
        }

        .available {
            background: #d4edda;
            color: #155724;
        }

        .taken {
            background: #f8d7da;
            color: #721c24;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }

        .copy-btn {
            padding: 5px 10px;
            font-size: 12px;
            background: #667eea;
            margin-left: 10px;
        }

        .no-results {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Domain Name Suggestion</h1>
        <p class="subtitle">Enter a keyword to get domain name suggestions</p>

        <div class="input-group">
            <input 
                type="text" 
                id="keywordInput" 
                placeholder="Enter a keyword (e.g., 'tech', 'store', 'blog')"
                autocomplete="off"
            >
            <button onclick="searchDomains()">Search</button>
        </div>

        <div class="loading" id="loading">
            <span>⏳ Searching for domains...</span>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script>
        // API endpoint for domain suggestions
        const API_ENDPOINT = 'https://api.domainsdb.info/v1/domains/search';

        // Function to search for domain suggestions
        async function searchDomains() {
            const keyword = document.getElementById('keywordInput').value.trim();
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');

            // Validation
            if (!keyword) {
                resultsDiv.innerHTML = '<div class="error">❌ Please enter a keyword</div>';
                return;
            }

            if (keyword.length < 2) {
                resultsDiv.innerHTML = '<div class="error">❌ Keyword must be at least 2 characters</div>';
                return;
            }

            // Show loading state
            loadingDiv.classList.add('active');
            resultsDiv.innerHTML = '';

            try {
                // Make API call to get domain suggestions
                const response = await fetch(`${API_ENDPOINT}?query=${encodeURIComponent(keyword)}&limit=10`);
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();

                // Hide loading
                loadingDiv.classList.remove('active');

                // Process and display results
                if (data.domains && data.domains.length > 0) {
                    displayResults(data.domains, keyword);
                } else {
                    resultsDiv.innerHTML = '<div class="no-results">📭 No domains found for your search</div>';
                }

            } catch (error) {
                loadingDiv.classList.remove('active');
                console.error('Error fetching domains:', error);
                resultsDiv.innerHTML = `<div class="error">❌ Error: ${error.message}<br><small>Please try again or use a different keyword</small></div>`;
            }
        }

        // Function to display results
        function displayResults(domains, keyword) {
            const resultsDiv = document.getElementById('results');
            let html = '<div class="results-title">✅ Found ' + domains.length + ' domains:</div>';

            domains.forEach((domain, index) => {
                html += `
                    <div class="domain-item">
                        <div class="domain-name">${index + 1}. ${domain}</div>
                        <button class="copy-btn" onclick="copyToClipboard('${domain}')">Copy</button>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }

        // Function to copy domain to clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Copied to clipboard: ' + text);
            }).catch(() => {
                alert('Failed to copy to clipboard');
            });
        }

        // Allow Enter key to trigger search
        document.getElementById('keywordInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchDomains();
            }
        });
    </script>
</body>
</html>
